# ============================================================
# full：正式训练配置（在服务器 RTX 5090 上跑）
#
# 下面这些数字是在真实 text8 上实测出来的，不是拍脑袋估的：
#   语料 token            17,005,207  （17.01M）
#   词表(min_count=5)         71,292  （<unk> 占 1.68%）
#   subsample=1e-4 之后    9.67M token（保留 56.9%）
#   每 epoch 样本对        58.04M     （= 有效 token × (window+1)）
#
#   ⚠️ 瓶颈不在 GPU，而在数据管道：
#      负采样放在预取线程里用 numpy 做（避免每步 GPU→CPU 同步），
#      实测「PairStream + 负采样」吞吐 ≈ 86 万样本对/秒，
#      而 5090 算这个 4280 万参数的小模型绰绰有余。
#      → 单 epoch ≈ 70 秒，5 个 epoch ≈ 6 分钟；
#        服务器 CPU 再慢一倍也远低于 6 小时上限。
#
#   max_minutes: 330 只是兜底保护，正常跑根本摸不到；超时会优雅停止并保存。
#   想看每条实测数字，随时可以跑：
#       python -m src.dataset --config configs/full.yaml --show 5
# ============================================================
run_name: full
seed: 42

data:
  source: text8             # demo | text8 | wikitext2 | local
  lang: en
  raw_dir: data/raw
  processed_dir: data/processed
  max_tokens: null          # 用完整语料
  min_count: 5
  max_vocab: null

model:
  arch: skipgram
  dim: 300                  # 原论文常用 300 维
  window: 5
  negative: 10              # 大规模语料推荐 5~15
  subsample: 1.0e-4
  sparse: true
  export: input             # 导出哪套向量：input | sum

train:
  epochs: 5
  batch_size: 8192
  lr: 0.0025                # SparseAdam 属 Adam 家族，lr 比原论文的 SGD(0.025) 小一档
  min_lr: 0.0001
  max_grad_norm: 5.0
  optimizer: sparseadam
  device: cuda              # 需要导师开卡；代码会做可用性检查并提示
  amp: false
  prefetch: 12              # 后台线程预取的 batch 数
  log_every: 500
  ckpt_every_steps: 20000
  max_minutes: 330          # 5.5 小时硬保护（< 6 小时要求）
  out_dir: runs

eval:
  every_epochs: 2            # 每隔 2 个 epoch 做一次中途评估（5 epoch 时会在 2、4 处看指标）
                             # 中途评估固定用内置小评测集，不联网、秒级、epoch 间可比
  topk: 10
  # 训练结束后的正式评估：用完整的公开标准数据集，指标才可与论文对比
  #   wordsim353      WordSim-353 全量（353 行 / 352 个唯一词对）
  #   google-analogy  Google Analogy Dataset（19544 题 / 14 类，含语义/句法分组）
  # 首次运行会自动下载并缓存到 data/eval/downloaded/；
  # 也可以提前手动拉取： python -m src.eval_data --fetch
  # 下载失败会自动回退到内置小评测集，不会中断流程。
  similarity_file: wordsim353
  analogy_file: google-analogy
  fetch: true                # false = 只用本地缓存，完全离线

viz:
  words_file: null
  top_words: 500
  methods: [pca, tsne]
  tsne_perplexity: 30
  out_dir: null
